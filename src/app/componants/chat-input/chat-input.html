<div class="w-full max-w-3xl mx-auto bg-transparent z-40">
  <!-- Haupt-Input-Container mit dunklem Hintergrund, lila Rand und Glow-Effekt -->
  <div
    class="relative w-full rounded-2xl border border-purple-900/60 bg-[#120824]/90 p-4 shadow-lg shadow-purple-950/20 backdrop-blur-md focus-within:border-purple-500 focus-within:shadow-[0_0_20px_rgba(168,85,247,0.2)] transition-all">

    <!-- Textarea / Eingabefeld -->
    <textarea
      rows="2"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [ngModel]="inputText()"
      (ngModelChange)="inputText.set($event)"
      (keydown)="onKeyDown($event)"
      class="w-full bg-transparent text-gray-200 placeholder-gray-500 resize-none outline-none text-base font-normal mb-3 disabled:opacity-50 disabled:cursor-not-allowed custom-input-scrollbar"
    ></textarea>

    <!-- Untere Leiste: Buttons & Tools -->
    <div class="flex items-center justify-between gap-2">

      <!-- Linke Seite: Plus-Button, Websuche & Code Interpreter -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Plus Button -->
        <button
          type="button"
          aria-label="Anhang hinzufügen"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-purple-800/40 bg-purple-950/30 text-gray-300 hover:bg-purple-900/40 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>

        <!-- Websuche Pill-Button -->
        <button
          type="button"
          (click)="toggleWebSearch()"
          [class.border-purple-500]="webSearchActive()"
          [class.bg-purple-900/60]="webSearchActive()"
          [class.text-purple-200]="webSearchActive()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-purple-800/40 bg-purple-950/30 text-xs font-medium text-gray-300 hover:bg-purple-900/40 hover:text-white transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
          <span>Websuche</span>
        </button>

        <!-- Code Interpreter Pill-Button -->
        <button
          type="button"
          (click)="toggleCodeInterpreter()"
          [class.border-purple-500]="codeInterpreterActive()"
          [class.bg-purple-900/60]="codeInterpreterActive()"
          [class.text-purple-200]="codeInterpreterActive()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-purple-800/40 bg-purple-950/30 text-xs font-medium text-gray-300 hover:bg-purple-900/40 hover:text-white transition cursor-pointer">
          <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span>Code Interpreter</span>
        </button>
      </div>

      <!-- Rechte Seite: Mikrofon & Absende-Button -->
      <div class="flex items-center gap-2">
        <!-- Mikrofon-Button -->
        <button
          type="button"
          aria-label="Spracheingabe"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-purple-800/40 bg-purple-950/30 text-gray-300 hover:bg-purple-900/40 hover:text-white transition cursor-pointer">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
        </button>

        <!-- Absende-Button (Senden-Pfeil) -->
        <button
          type="button"
          (click)="sendMessage()"
          [disabled]="!inputText().trim() || disabled()"
          aria-label="Nachricht senden"
          class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-500 hover:to-pink-500 transition shadow-md shadow-purple-600/30 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>
