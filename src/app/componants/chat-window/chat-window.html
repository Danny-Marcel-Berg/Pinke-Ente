<div #messagesContainer class="w-full h-full overflow-y-auto px-4 py-6 space-y-6 custom-scrollbar">
  <div class="max-w-4xl mx-auto space-y-6">

    @for (msg of messages(); track msg.id) {
      @if (msg.sender === 'user') {
        <!-- User Message Bubble (Right) -->
        <div class="flex items-start justify-end gap-3 group animate-fadeIn">
          <div class="flex flex-col items-end max-w-[85%] sm:max-w-[75%]">
            <div class="flex items-center gap-2 mb-1 px-1">
              <span class="text-[11px] text-gray-400">{{ msg.timestamp | date:'HH:mm' }}</span>
              <span class="text-xs font-semibold text-purple-300">Du</span>
            </div>
            <div
              class="px-4 py-3 rounded-2xl rounded-tr-sm bg-gradient-to-br from-[#2a104e] to-[#1a0736] border border-purple-600/40 text-gray-100 text-sm sm:text-base leading-relaxed shadow-lg shadow-purple-950/40 select-text whitespace-pre-wrap">
              {{ msg.text }}
            </div>
          </div>

          <!-- User Avatar -->
          <div class="w-8 h-8 rounded-full bg-purple-950/80 border border-purple-600/50 flex items-center justify-center text-purple-300 shrink-0 shadow-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        </div>
      } @else {
        <!-- Assistant Message Bubble (Left) -->
        <div class="flex items-start justify-start gap-3 group animate-fadeIn">
          <!-- Duck Avatar -->
          <div class="relative w-8 h-8 rounded-full bg-gradient-to-br from-pink-950/80 to-purple-950/90 border border-pink-500/60 flex items-center justify-center shrink-0 shadow-lg shadow-pink-950/50 overflow-hidden">
            <img src="assets/duck_no_bg (1).png" alt="Pinke Ente" class="w-7 h-7 object-contain scale-125" />
            <div class="absolute inset-0 rounded-full ring-1 ring-inset ring-pink-400/30"></div>
          </div>

          <div class="flex flex-col items-start max-w-[88%] sm:max-w-[80%]">
            <div class="flex items-center gap-2 mb-1 px-1">
              <span class="text-xs font-semibold bg-gradient-to-r from-pink-400 to-purple-300 bg-clip-text text-transparent">Pinke Ente</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-pink-950/60 text-pink-300 border border-pink-700/40 font-mono">Cyber KI</span>
              <span class="text-[11px] text-gray-500">{{ msg.timestamp | date:'HH:mm' }}</span>
            </div>

            <div
              class="relative px-4 py-3.5 rounded-2xl rounded-tl-sm bg-[#120824]/90 border border-purple-900/60 text-gray-200 text-sm sm:text-base leading-relaxed shadow-lg shadow-purple-950/30 select-text whitespace-pre-wrap backdrop-blur-sm group-hover:border-purple-700/60 transition">
              {{ msg.text }}

              <!-- Actions row (Copy button) -->
              <div class="mt-2.5 pt-2 border-t border-purple-900/30 flex items-center justify-between text-xs text-gray-400">
                <span class="text-[11px] text-purple-400/70 font-mono">Pinke-Ente v1.0</span>
                <button
                  type="button"
                  (click)="copyMessage(msg)"
                  class="flex items-center gap-1 text-xs text-gray-400 hover:text-purple-300 transition cursor-pointer px-1.5 py-0.5 rounded hover:bg-purple-950/40">
                  @if (copiedId() === msg.id) {
                    <svg class="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="text-green-400 text-[11px]">Kopiert!</span>
                  } @else {
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span class="text-[11px]">Kopieren</span>
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    }

    <!-- Typing Indicator when Bot is thinking -->
    @if (isTyping()) {
      <div class="flex items-start justify-start gap-3 animate-fadeIn">
        <div class="relative w-8 h-8 rounded-full bg-gradient-to-br from-pink-950/80 to-purple-950/90 border border-pink-500/60 flex items-center justify-center shrink-0 shadow-lg shadow-pink-950/50 overflow-hidden animate-pulse">
          <img src="assets/duck_no_bg (1).png" alt="Pinke Ente" class="w-7 h-7 object-contain scale-125" />
        </div>

        <div class="px-4 py-3 rounded-2xl rounded-tl-sm bg-[#120824]/90 border border-purple-800/50 flex items-center gap-2 shadow-md">
          <span class="w-2 h-2 rounded-full bg-pink-400 animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-2 h-2 rounded-full bg-purple-400 animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-2 h-2 rounded-full bg-pink-300 animate-bounce" style="animation-delay: 300ms"></span>
          <span class="text-xs text-purple-300/80 ml-1 font-medium font-mono">Pinke Ente analysiert...</span>
        </div>
      </div>
    }

  </div>
</div>
